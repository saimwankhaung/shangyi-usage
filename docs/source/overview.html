<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overview</title>
<link rel="stylesheet" href="style.css">
<style>
  .brand{position:absolute;left:96px;top:150px;display:flex;align-items:center;gap:22px}
  .brand img{width:62px;height:68px}
  .brand h1{font-size:66px;font-weight:700;letter-spacing:-1.5px}
  .brand h1 span{font-weight:400;color:#d6e2d1}
  .pill{position:absolute;left:100px;top:270px;border:3px solid var(--lime);color:var(--lime);border-radius:40px;padding:8px 26px 10px;font-size:30px;font-weight:700;letter-spacing:4px}
  .headline{position:absolute;left:92px;top:355px;font-size:118px;line-height:1.02;font-weight:800;letter-spacing:-4px}
  .headline em{display:block;font-style:normal;color:var(--lime)}
  .sub{position:absolute;left:98px;top:640px;font-size:42px;font-weight:600;letter-spacing:-.5px}
  .foot{position:absolute;left:100px;bottom:62px;font-size:24px;color:var(--muted);letter-spacing:1.5px}
  .mascot{position:absolute;left:760px;bottom:40px;width:400px;height:400px}
  .panel{position:absolute;right:86px;top:50%;transform:translateY(-50%)}
</style>
</head>
<body>
  <div class="brand"><img src="../../app/assets/logos/shangyi.svg" alt=""><h1>ShanGyi <span>Usage</span></h1></div>
  <div class="pill">OPEN SOURCE</div>
  <div class="headline">Your limits,<em>at a glance.</em></div>
  <div class="sub">Claude + Codex usage monitor</div>
  <div class="foot">MIT-licensed code · Example numbers</div>
  <img class="mascot" src="../../app/assets/mascot/poster.png" alt="">
  <img class="panel" src="../images/usage-panel.png" alt="">
</body>
</html>
